name: Refresh blog hub
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/build_blog_hub.py
      - run: |
          git config user.name "blog-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add blog/index.html
          git diff --cached --quiet || git commit -m "Refresh blog hub"
          git push
